[package]
name = "expri-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local task instrumentation for expri experiments"
license = "MIT"
repository = "https://github.com/agentic-rs/expri"
readme = "README.md"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2.186"
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[dev-dependencies]
tempfile = "3.27.0"
