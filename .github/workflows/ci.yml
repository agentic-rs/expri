name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features --locked

  dashboard-web:
    name: Dashboard web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Install frontend dependencies
        run: pnpm --dir dashboard_web install --frozen-lockfile

      - name: Check frontend types and behavior
        run: |
          pnpm --dir dashboard_web check
          pnpm --dir dashboard_web test

      - name: Verify embedded frontend asset
        run: |
          pnpm --dir dashboard_web build
          git diff --exit-code -- dashboard_web/app.js

  container-workflow:
    name: Host and worker workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run real uv and SSH workflows with installed Torch fixtures
        env:
          EXPRI_CONTAINER_ARTIFACTS: ${{ runner.temp }}/expri-containers
        run: tests/containers/run.sh

      - name: Save bounded workflow and image build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-workflow-logs
          path: ${{ runner.temp }}/expri-containers/*.log
          if-no-files-found: ignore
          retention-days: 7

  service-workflow:
    name: Self-hosted S3 workflow
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify service workflow progress reporting
        run: python3 -B tests/containers/workflow_progress_tests.py

      - name: Test private inputs, offline runs, resumable checkpoints and local review
        env:
          EXPRI_CONTAINER_ARTIFACTS: ${{ runner.temp }}/expri-service-containers
        run: python3 -B tests/containers/service_workflow.py

      - name: Save service workflow and image build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: service-workflow-logs
          path: |
            ${{ runner.temp }}/expri-service-containers/*.log
            ${{ runner.temp }}/expri-service-containers/*.png
          if-no-files-found: ignore
          retention-days: 7

  python-runtime:
    name: Python runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv and runtime test dependencies
        run: |
          python3 -m pip install uv==0.8.15
          uv pip install --system --python python3 packaging==25.0 tomli==2.2.1

      - name: Run dependency graph and offline uv integration tests
        run: python3 -B src/environment/runtime_tests.py

      - name: Run binary and live subprocess logging tests
        run: python3 -B src/run_logs_tests.py

      - name: Run detached supervision and job controls tests
        run: |
          python3 -B src/jobs_tests.py
          python3 -B src/run_lifecycle_tests.py

      - name: Run metrics producer tests
        run: python3 -B python/expri_metrics_tests.py

      - name: Verify installed-package fixture wheels
        run: python3 -B tests/containers/fixtures_tests.py

      - name: Verify browser attachment fixture isolation
        run: python3 -B tests/browser_proxy_tests.py

      - name: Verify branch deployment and rollback
        run: python3 -B tests/deployment_tests.py
