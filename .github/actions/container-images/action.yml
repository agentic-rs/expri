name: Build cached acceptance images
description: Load acceptance images with persistent Docker layers and Cargo cache mounts.

inputs:
  cache-role:
    description: Unique cache namespace for parallel workflow jobs.
    required: true
  include-service:
    description: Also build the service, browser, and source-built S3 fixtures.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4

    # Post steps run in reverse order: extract the mounts before saving this
    # snapshot, then remove the builder. Stable dependency keys avoid saving
    # another large Cargo snapshot for every source-only commit.
    - name: Restore Cargo cache mounts
      id: cargo-cache
      uses: actions/cache@v5
      with:
        path: |
          ${{ runner.temp }}/expri-cargo-${{ inputs.cache-role }}/registry
          ${{ runner.temp }}/expri-cargo-${{ inputs.cache-role }}/target
        key: expri-container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-${{ hashFiles('Cargo.lock', 'tests/containers/Dockerfile') }}

    - name: Inject and later extract Cargo cache mounts
      uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
      with:
        builder: ${{ steps.buildx.outputs.name }}
        scratch-dir: ${{ runner.temp }}/expri-cache-dance-${{ inputs.cache-role }}
        cache-map: |
          {
            "${{ runner.temp }}/expri-cargo-${{ inputs.cache-role }}/registry": "/usr/local/cargo/registry",
            "${{ runner.temp }}/expri-cargo-${{ inputs.cache-role }}/target": "/build/target"
          }
        skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

    - name: Build worker image
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: tests/containers/Dockerfile
        target: worker
        tags: expri-ci-worker
        load: true
        push: false
        # A layer hit does not populate cache mounts. On the first dependency
        # snapshot, execute the builder to seed Cargo before its post-step save.
        no-cache-filters: ${{ steps.cargo-cache.outputs.cache-hit != 'true' && 'builder' || '' }}
        cache-from: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-worker
        cache-to: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-worker,mode=max,ignore-error=true

    - name: Build host image
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: tests/containers/Dockerfile
        target: host
        tags: expri-ci-host
        load: true
        push: false
        cache-from: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-host
        cache-to: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-host,mode=max,ignore-error=true

    - name: Build service image
      if: inputs.include-service == 'true'
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: tests/containers/Dockerfile
        target: service
        tags: expri-ci-service
        load: true
        push: false
        cache-from: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-service
        cache-to: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-service,mode=max,ignore-error=true

    - name: Build browser image
      if: inputs.include-service == 'true'
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: tests/containers/Dockerfile
        target: browser
        tags: expri-ci-browser
        load: true
        push: false
        cache-from: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-browser
        cache-to: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-browser,mode=max,ignore-error=true

    - name: Build S3 image from source
      if: inputs.include-service == 'true'
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: .
        file: tests/containers/S3.Dockerfile
        tags: expri-ci-s3
        load: true
        push: false
        cache-from: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-s3
        cache-to: type=gha,scope=expri-containers-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.cache-role }}-s3,mode=max,ignore-error=true
