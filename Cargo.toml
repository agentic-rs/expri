[workspace]
members = ["crates/expri-core", "crates/expri-run-data"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/agentic-rs/expri"

[workspace.dependencies]
expri-core = { version = "=0.1.5", path = "crates/expri-core" }
expri-run-data = { version = "=0.1.5", path = "crates/expri-run-data" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
globset = "0.4.18"
http = "1.5.0"
libc = "0.2.186"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tempfile = "3.27.0"
toml = "1.1.2"
url = "2.5.8"

[package]
name = "expri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Repo-local remote experiment workflow tools"
license.workspace = true
repository.workspace = true

[dependencies]
attohttpc = { version = "0.30.1", default-features = false }
base64 = "0.22.1"
chrono.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
expri-core.workspace = true
expri-run-data.workspace = true
globset.workspace = true
form_urlencoded = "1.2.2"
http.workspace = true
httparse = "1.10.1"
libc.workspace = true
quick-xml = { version = "0.38.3", features = ["serialize", "overlapped-lists"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-s3 = { version = "=0.37.2", default-features = false, features = ["sync-rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
subtle = "2.6.1"
tempfile.workspace = true
toml.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
