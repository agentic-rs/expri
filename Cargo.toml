[workspace]
members = [
  "crates/core",
  "crates/runs",
  "crates/client",
  "crates/assets",
  "crates/worker",
  "crates/dashboard",
  "crates/server",
  "crates/system",
  "sdk/rust",
]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/agentic-rs/expri"

[workspace.dependencies]
expri-core = { version = "=0.1.5", path = "crates/core" }
expri-runs = { version = "=0.1.5", path = "crates/runs" }
expri-client = { version = "=0.1.5", path = "crates/client" }
expri-assets = { version = "=0.1.5", path = "crates/assets" }
expri-worker = { version = "=0.1.5", path = "crates/worker" }
expri-dashboard = { version = "=0.1.5", path = "crates/dashboard" }
expri-server = { version = "=0.1.5", path = "crates/server" }
expri-system = { version = "=0.1.5", path = "crates/system", default-features = false }
attohttpc = { version = "0.30.1", default-features = false }
base64 = "0.22.1"
flate2 = "1.1.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
form_urlencoded = "1.2.2"
globset = "0.4.18"
http = "1.5.0"
hmac = "0.13.0"
httparse = "1.10.1"
libc = "0.2.186"
quick-xml = { version = "0.38.3", features = ["serialize", "overlapped-lists"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-s3 = { version = "=0.37.2", default-features = false, features = ["sync-rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rpassword = "7.5.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }
sha2 = "0.11.0"
subtle = "2.6.1"
sysinfo = { version = "=0.37.2", default-features = false, features = ["system", "disk", "network"] }
nvml-wrapper = "=0.11.0"
tempfile = "3.27.0"
toml = "1.1.2"
url = "2.5.8"
uuid = { version = "=1.18.1", features = ["v4"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[package]
name = "expri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Repo-local remote experiment workflow tools"
license.workspace = true
repository.workspace = true

[dependencies]
base64.workspace = true
flate2.workspace = true
chrono.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
expri-core.workspace = true
expri-runs.workspace = true
expri-client.workspace = true
expri-assets.workspace = true
expri-worker.workspace = true
expri-dashboard.workspace = true
expri-server.workspace = true
expri-system = { workspace = true, features = ["collector"] }
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
url.workspace = true
uuid.workspace = true
unicode-width = "0.2.2"
