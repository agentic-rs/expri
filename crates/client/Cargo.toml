[package]
name = "expri-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Durable experiment publishing and resumable transfers for expri"
license.workspace = true
repository.workspace = true

[dependencies]
expri-core.workspace = true
expri-runs.workspace = true
expri-system = { workspace = true, default-features = false }
base64.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["stream"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { version = "1", features = ["rt", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
