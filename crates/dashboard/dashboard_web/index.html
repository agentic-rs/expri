<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>expri · Experiment workspace</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body class="dashboard-page">
    <a class="skip-link" href="#runs-heading">Skip to runs</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" aria-label="expri dashboard"
          ><span class="brand-mark" aria-hidden="true">e</span>expri</a
        >
        <div class="project-context">
          <span class="eyebrow">Project</span><span class="project-name" id="project-name"></span>
        </div>
        <span class="read-only">Read only</span>
        <div id="source-controls-root" class="source-controls"></div>
        <form id="logout-form" class="session-actions" method="post" action="/logout" hidden>
          <button class="text-button" type="submit">Sign out</button>
        </form>
      </div>
    </header>
    <main class="workspace-main">
      <div id="dashboard-root"></div>
      <noscript
        ><p class="notice">Enable JavaScript to review recorded experiment results.</p></noscript
      >
      <footer><span id="dashboard-kind"></span><span>Recorded results · Read only</span></footer>
    </main>
  </body>
</html>
